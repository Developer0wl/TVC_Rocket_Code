[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tvc"
version = "0.1.0"
description = "TVC rocket 6-DoF simulation, classical control, and RL"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "scipy",
    "gymnasium",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]
# Installed in the RL milestone; torch needs the CUDA wheel index, see CLAUDE.md.
ml = ["stable-baselines3", "optuna", "cma", "onnx", "onnxruntime"]

[tool.setuptools.packages.find]
include = ["tvc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
